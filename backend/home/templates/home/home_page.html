{% extends "base.html" %}

{% block content %}
<main class="mx-auto max-w-5xl px-6 py-20">
  <h1 class="text-4xl font-bold tracking-tight text-slate-900">{{ page.title }}</h1>
  {% if page.intro %}
    <div class="mt-6 max-w-none">{{ page.intro }}</div>
  {% else %}
    <p class="mt-4 text-lg text-slate-600">Your new website starts here.</p>
  {% endif %}
</main>
{% endblock %}
